<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>식사 주문 계산기 (Supabase 자동 저장)</title>
<!-- Supabase JS SDK CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--sub:#6b7385;--line:#e2e5ec;--pri:#2f6fed;--prit:#fff;--warn:#fff4e0;--warnt:#8a5a00;--bad:#d64545;--okc:#2e9e5b;--warnc:#e0a100}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1e222b;--tx:#e8ebf2;--sub:#98a0b3;--line:#2e3441;--pri:#5b8cff;--prit:#0d1220;--warn:#3a2f14;--warnt:#f0c36a;--bad:#ff7b7b;--okc:#4cc27f;--warnc:#f0c36a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:20px 14px 60px}
h1{font-size:20px;margin:0 0 14px}
h2{font-size:15px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
select{flex:1;min-width:140px}
textarea{width:100%;min-height:150px;resize:vertical;line-height:1.6}
button{cursor:pointer}
button.pri{background:var(--pri);color:var(--prit);border-color:var(--pri);font-weight:600}
button.del{color:var(--bad)}
.sub{color:var(--sub);font-size:13px}
details summary{cursor:pointer;font-weight:600}
table{width:100%;border-collapse:collapse}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}
.price{width:100px;text-align:right}
.warn{background:var(--warn);color:var(--warnt);border-color:transparent}
.person{display:flex;justify-content:space-between;gap:10px;font-weight:700;margin-bottom:4px}
.unk{color:var(--warnt);font-size:13px}
.total{font-size:18px;font-weight:700;text-align:right;margin-top:8px}
.detail{background:var(--bg);border-radius:8px;padding:10px;margin:2px 0 6px}
.ok{color:var(--pri);font-size:13px;margin-left:6px}
.note{color:var(--sub);font-size:13px;margin-top:2px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .3s}
.bar.ok i{background:var(--okc)}.bar.warn i{background:var(--warnc)}.bar.over i{background:var(--bad)}
.blab{display:flex;justify-content:space-between;font-size:13px;margin-top:3px;color:var(--sub)}
.blab.ok b{color:var(--okc)}.blab.warn b{color:var(--warnc)}.blab.over b{color:var(--bad)}
.overc{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad) inset}
.badge{background:var(--bad);color:#fff;border-radius:6px;padding:0 6px;font-size:12px;margin-left:6px}
.bad{color:var(--bad)}
.chip{display:inline-flex;gap:2px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;font-size:13px}
.chip button{border:0;background:none;padding:0 6px;cursor:pointer;color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
<h1>🍱 식사 주문 계산기 (Supabase 자동 저장)</h1>

<div class="card" id="syncBar">
  <div class="row">
    <b>☁ 클라우드 동기화</b>
    <span id="syncStatus" class="sub" style="flex:1;min-width:160px">Supabase 연결 중...</span>
  </div>
</div>

<div class="card">
  <div class="row">
    <select id="rest"></select>
    <button id="addRest">+ 식당 추가</button>
    <button id="renRest">이름 변경</button>

  <details style="margin-top:10px">

      <label class="sub" style="display:flex;align-items:center;gap:6px;">

<div class="card">

    <div id="noteList" class="row"></div>
    <div class="row" style="margin-top:8px"><input id="newNote" placeholder="예: 덜맵게, 샐러드 빼고" style="flex:1;min-width:160px"><button id="addNote">요청사항 등록</button></div>
  </details>
</div>

<div class="card">
  <h2>주문 입력 <span class="sub">(한 줄에 한 명)</span></h2>
  <textarea id="input" placeholder="홍길동: 김치찌개 공기밥2
김영희: 된장찌개 x2
박철수: 제육볶음 3개, 계란말이
이순신: 짜장면 곱배기 2
최민수: 라면 치즈2"></textarea>
  <div class="row" style="margin-top:8px"><label class="sub">인당 한도 <input id="limit" type="number" min="0" step="500" class="price" value="9000"> 원 · 총 한도는 인원수 × 인당 한도 (0이면 표시 안 함)</label></div>
  <div class="row" style="margin-top:8px;justify-content:space-between">
    <label class="sub"><input type="checkbox" id="nameFirst" style="padding:0"> 첫 단어를 이름으로 처리 (이름 뒤에 : 없이 쓰는 경우 체크)</label>

<script type="module">
// ===== Supabase 설정 정보 (본인의 값으로 변경하세요) =====
const SUPABASE_URL = 'https://biqnpnwhsenskwnkpfif.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpcW5wbndoc2Vuc2t3bmtwZmlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxNzE2NTcsImV4cCI6MjEwODc0NzY1N30.PHaGtBnpQVJzoFhW6eMDF9TriOz68QlXxFJUVH2BbBE';
const BUCKET_NAME = 'json'; // Supabase Storage 버킷 이름
const FILE_PATH = 'order_calculator_data.json'; // 저장될 JSON 파일명

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const KEY = 'orderCalc.v1';
const $ = id => document.getElementById(id);
let state = { restaurants: { '식당 1': { menu: {}, history: [] } }, notes: {}, limit: 9000, current: '식당 1' };
let last = null, unkList = [];
const opened = new Set();

// <parser>
const UNIT = '(?:개|인분|그릇|잔|판|ea)';
const PURE_QTY = new RegExp('^[x×*]?(\\d+)' + UNIT + '?$', 'i');
const TRAIL_QTY = new RegExp('^(.+?)[x×*]?(\\d+)' + UNIT + '?$', 'i');
const LEAD_QTY = new RegExp('^\\s*[x×*]?\\s*(\\d+)\\s*' + UNIT + '?(?=\\s|$)', 'i');

function priceFor(e, n) {
  if (n <= 0) return 0;
  if (e.tiers[n] !== undefined) return e.tiers[n];
  let rem = n, t = 0;
  Object.keys(e.tiers).map(Number).filter(q => q >= 1).sort((a, b) => b - a).forEach(q => {
    while (rem >= q) { t += e.tiers[q]; rem -= q; }
  });
  return t + rem * e.price;
}
const parseTiers = s => {
  const t = {};
  s.split(/[,\s]+/).forEach(x => { const m = x.match(/^(\d+)[:=](\d+)$/); if (m && +m[1] >= 1) t[+m[1]] = +m[2]; });
  return t;
};
const tiersStr = t => Object.keys(t).sort((a, b) => a - b).map(q => q + ':' + t[q]).join(', ');

function parseOrders(text, menuMap, nameFirst, notesMap) {
  const lookOf = map => {
    const l = Object.create(null);
    Object.keys(map).forEach(k => { l[k] = k; });
    Object.keys(map).forEach(k => (map[k].alias || []).forEach(a => { if (!(a in l)) l[a] = k; }));
    return l;
  };
  const look = lookOf(menuMap);
  const names = Object.keys(look).sort((a, b) => b.length - a.length);
  const noteNames = Object.keys(notesMap || {}).sort((a, b) => b.length - a.length);
  const find = (s, list) => list.find(n => s.startsWith(n) && (s.length === n.length || /[\s\dxX×*]/.test(s[n.length])));
  const key = i => i.name + '|' + Object.keys(i.opts).sort().map(o => o + i.opts[o]).join(',') + '|' + i.notes.join(',');
  const push = (items, name, qty, opts, ctx) => items.push({ name, qty, opts: opts || {}, ctx, notes: [] });
  const mergeItems = list => {
    const out = [];
    list.forEach(i => { const f = out.find(o => key(o) === key(i)); if (f) f.qty += i.qty; else out.push(i); });
    return out;
  };
  const addNote = (items, pnotes, txt) => {
    const t = items[items.length - 1], arr = t ? t.notes : pnotes;
    if (!arr.includes(txt)) arr.push(txt);
  };
  const people = [], byName = {};
  let anon = 0;
  text.split(/\r?\n/).forEach(raw => {
    const line = raw.trim().replace(/\s+/g, ' ');
    if (!line) return;
    let name = '', rest = line;
    const c = line.match(/^([^:：]+)[:：]\s*(.*)$/);
    if (c) { name = c[1].trim(); rest = c[2]; }
    else if (nameFirst) {
      const m = line.match(/^(\S+)\s*(.*)$/);
      if (m && !find(m[1], names)) { name = m[1]; rest = m[2]; }
    }
    const items = [], pnotes = [];
    let s = rest.replace(/[,，、\/+&]/g, ' | ').replace(/[()（）\[\]{}]/g, ' ');
    while (true) {
      s = s.trim();
      if (!s) break;
      if (s[0] === '|') { s = s.slice(1); continue; }
      if (s[0] === '#') {
        const t = s.match(/^\S+/)[0];
        s = s.slice(t.length);
        const txt = t.replace(/^#+/, '').replace(/_/g, ' ');
        if (txt) addNote(items, pnotes, txt);
        continue;
      }
      const nm = find(s, noteNames), km = find(s, names);
      if (nm && (!km || nm.length >= km.length)) { s = s.slice(nm.length); addNote(items, pnotes, nm); continue; }
      if (km) {
        const k = look[km];
        s = s.slice(km.length);
        let qty = 1, explicit = false;
        const q = s.match(LEAD_QTY);
        if (q) { qty = +q[1]; explicit = true; s = s.slice(q[0].length); }
        const defs = menuMap[k].opts || {};
        const olook = lookOf(defs), oNames = Object.keys(olook).sort((a, b) => b.length - a.length), opts = {};
        while (true) {
          s = s.trim();
          const om = find(s, oNames);
          if (!om) break;
          const o = olook[om];
          s = s.slice(om.length);
          const oq = s.match(LEAD_QTY);
          let cnt = 1;
          if (oq) {
            if (defs[o].multi) { cnt = +oq[1]; s = s.slice(oq[0].length); }
            else if (!explicit) { qty = +oq[1]; explicit = true; s = s.slice(oq[0].length); }
          }
          opts[o] = (opts[o] || 0) + cnt;
        }
        push(items, k, qty, opts);
        continue;
      }
      let t = s.match(/^\S+/)[0];
      s = s.slice(t.length);
      const p = t.match(PURE_QTY);
      if (p && items.length) { items[items.length - 1].qty = +p[1]; continue; }
      const prev = items[items.length - 1];
      const ctx = prev && menuMap[prev.name] ? prev.name : '';
      const words = [];
      let qty = 1;
      while (true) {
        const tq = t.match(TRAIL_QTY);
        if (tq) { words.push(tq[1]); qty = +tq[2]; break; }
        words.push(t);
        const nx = s.trim();
        if (!nx || nx[0] === '|' || nx[0] === '#' || find(nx, noteNames) || find(nx, names)) break;
        const nt = nx.match(/^\S+/)[0];
        if (PURE_QTY.test(nt)) break;
        s = nx.slice(nt.length); t = nt;
      }
      push(items, words.join(' '), qty, {}, ctx);
    }
    const list = mergeItems(items);
    if (!name) name = '주문 ' + (++anon);
    if (byName[name]) {
      const b = byName[name];
      b.items = mergeItems(b.items.concat(list));
      pnotes.forEach(n => { if (!b.notes.includes(n)) b.notes.push(n); });
    } else { const p = { name, items: list, notes: pnotes }; byName[name] = p; people.push(p); }
  });
  return people;
}

function norm(v) {
  if (typeof v === 'number') v = { price: v };
  v.price = +v.price || 0; v.tiers = v.tiers || {}; v.opts = v.opts || {}; v.alias = Array.isArray(v.alias) ? v.alias : [];
  v.history = Array.isArray(v.history) ? v.history : [];
  for (const k in v.opts) { const o = v.opts[k]; o.price = +o.price || 0; o.tiers = o.tiers || {}; o.multi = !!o.multi; o.alias = Array.isArray(o.alias) ? o.alias : []; }
  return v;
}

// Supabase로부터 데이터 불러오기
async function load() {
  try {
    const { data, error } = await supabaseClient.storage
      .from(BUCKET_NAME)
      .download(FILE_PATH);

    if (error) throw error;

    const text = await data.text();
    const s = JSON.parse(text);
    if (s && s.restaurants && Object.keys(s.restaurants).length) {
      state = s;
      if (!state.restaurants[state.current]) state.current = Object.keys(state.restaurants)[0];
    }
    $('syncStatus').textContent = 'Supabase 데이터 로드됨 (자동 동기화 활성화)';
  } catch (e) {
    console.error('Supabase 로드 실패, 로컬 데이터 사용:', e);
    $('syncStatus').textContent = '로컬 데이터 사용 중 (Supabase 연결 확인 필요)';
    try {
      const local = JSON.parse(localStorage.getItem(KEY));
      if (local && local.restaurants) state = local;
    } catch (err) {}
  }
  Object.values(state.restaurants).forEach(r => { r.menu = r.menu || {}; r.history = Array.isArray(r.history) ? r.history : []; for (const k in r.menu) r.menu[k] = norm(r.menu[k]); });
  state.notes = isObj(state.notes) ? state.notes : {};
  if (typeof state.limit !== 'number' || !(state.limit >= 0)) state.limit = 9000;
}

// Supabase Storage에 자동 저장 (Debounce 적용으로 빈번한 요청 방지)
let saveTimeout = null;
function saveSupabaseStorage() {
  $('syncStatus').textContent = '저장 중...';
  try {
    const jsonString = JSON.stringify(state, null, 2);
    const file = new Blob([jsonString], { type: 'application/json' });

    supabaseClient.storage
      .from(BUCKET_NAME)
      .upload(FILE_PATH, file, {
        contentType: 'application/json',
        upsert: true
      })
      .then(({ error }) => {
        if (error) throw error;
        $('syncStatus').textContent = '☁ Supabase에 자동 저장됨';
      })
      .catch(e => {
        console.error('자동 저장 실패:', e);
        $('syncStatus').textContent = '⚠ 자동 저장 실패 (RLS 정책 확인)';
      });
  } catch (e) {
    console.error('저장 예외:', e);
  }
}

function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

// 변경 발생 시 로컬 저장 후 Supabase 자동 저장 예약 (0.8초 딜레이)
// 기존 코드
// function save() {
//   saveLocal();
//   if (saveTimeout) clearTimeout(saveTimeout);
//   saveTimeout = setTimeout(saveSupabaseStorage, 800);
// }

// 변경할 코드 (즉시 동기화)
function save() {
  saveLocal();
  saveSupabaseStorage();
}

const menu = () => state.restaurants[state.current].menu;
const won = n => n.toLocaleString('ko-KR') + '원';
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function setMenu(name, price) {
  name = (name || '').trim().replace(/\s+/g, ' ');
  price = Math.round(price);
  if (!name || !(price >= 0)) return false;
  const e = menu()[name];
  if (e) e.price = price; else menu()[name] = norm({ price });
  return true;
}

const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ', JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅗ<b><b><b><b>ㅘ</b><b>ㅙ</b><b>ㅚ</b>ㅛㅜ</b><b><b>ㅝ</b><b>ㅞ</b><b>ㅟ</b>ㅠㅡ</b>ㅢㅣ', JONG = ' ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ';
function jamo(s) {
  return [...s.replace(/\s/g, '').toLowerCase()].map(ch => {
    const c = ch.charCodeAt(0) - 0xAC00;
    if (c < 0 || c > 11171) return ch;
    return CHO[Math.floor(c / 588)] + JUNG[Math.floor((c % 588) / 28)] + JONG[c % 28].trim();
  }).join('');
}
function sim(a, b) {
  a = jamo(a); b = jamo(b);
  const d = [];
  for (let i = 0; i <= a.length; i++) d[i] = [i];
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++)
    for (let j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return 1 - d[a.length][b.length] / Math.max(a.length, b.length, 1);
}
function cleanAlias(v, mn, on) {
  const m = menu(), out = [], bad = [];
  v.split(/[,，\n]+/).map(x => x.trim().replace(/\s+/g, ' ')).filter(Boolean).forEach(a => {
    if (a === (on || mn)) return;
    let taken;
    if (!on) taken = Object.keys(m).some(k => k === a || (k !== mn && m[k].alias.includes(a)));
    else { const os = m[mn].opts; taken = Object.keys(os).some(k => k === a || (k !== on && os[k].alias.includes(a))); }
    if (taken) bad.push(a); else if (!out.includes(a)) out.push(a);
  });
  if (bad.length) alert('이미 다른 이름으로 쓰이고 있어 제외했습니다: ' + bad.join(', '));
  return out;
}

function renderRest() {
  $('rest').innerHTML = Object.keys(state.restaurants).map(n =>
    `<option value="${esc(n)}"${n === state.current ? ' selected' : ''}>${esc(n)}</option>`).join('');
}
function renderMenu() {
  const m = menu(), names = Object.keys(m);
  $('menuSum').textContent = `메뉴판 (${names.length}개 등록됨)`;
  $('menuBody').innerHTML = names.length ? names.map(n => {
    const e = m[n], on = opened.has(n), oc = Object.keys(e.opts).length, q = esc(n);
    let h = `<tr><td>${q}<div class="sub">${e.alias.length ? '별칭 ' + e.alias.length + '개 ' : ''}${Object.keys(e.tiers).length ? '수량가격 ' : ''}${oc ? '옵션 ' + oc + '개' : ''}</div></td>
      <td class="n"><input class="price" type="number" min="0" step="100" value="${e.price}" data-m="${q}" data-f="price"> 원</td>
      <td class="n"><button data-t="${q}">${on ? '접기' : '상세'}</button> <button class="del" data-d="${q}">삭제</button></td></tr>`;
    if (on) {
      h += `<tr><td colspan="3"><div class="detail">
        <div class="sub">별칭 (쉼표로 구분) · 사람마다 다르게 쓰는 이름. 예: 돈가스, 돈까스</div>
        <input data-m="${q}" data-f="alias" value="${esc(e.alias.join(', '))}" placeholder="별칭1, 별칭2" style="width:100%;margin:4px 0 10px">
        <div class="sub">수량별 총액 · 예: 2:1000, 3:1500 (2개면 1,000원). 없는 수량은 큰 묶음부터 적용하고 나머지는 기본 가격으로 계산</div>
        <input data-m="${q}" data-f="tiers" value="${esc(tiersStr(e.tiers))}" placeholder="2:1000, 3:1500" style="width:100%;margin:4px 0 10px">
        <div class="sub">옵션 (곱배기·토핑 등) · 메뉴 1개당 추가 요금. 개수형은 '치즈2'처럼 개수를 쓸 수 있는 옵션</div>` +
        Object.keys(e.opts).map(o => {

            <label class="sub"><input type="checkbox" ${a} data-f="omulti"${x.multi ? ' checked' : ''}> 개수형</label>
            <input ${a} data-f="otiers" value="${esc(tiersStr(x.tiers))}" placeholder="수량가 2:1000" style="width:130px">

}

function calc() {
  const m = menu();
  const people = parseOrders($('input').value, m, $('nameFirst').checked, state.notes);
  const unk = new Map(), totals = {};
  let grand = 0;
  people.forEach(p => {
    p.sum = 0; p.miss = false;
    p.items.forEach(i => {
      const on = Object.keys(i.opts), e = m[i.name];
      i.label = i.name + (on.length ? ' (' + on.map(o => o + (i.opts[o] > 1 ? '×' + i.opts[o] : '')).join(', ') + ')' : '');
      if (!e) {
        const k = (i.ctx || '') + '\u0001' + i.name;
        if (!unk.has(k)) unk.set(k, { name: i.name, ctx: i.ctx || '' });
        p.miss = true; i.amt = null;
      } else {
        const per = on.reduce((a, o) => a + priceFor(e.opts[o], i.opts[o]), 0);
        i.base = priceFor(e, i.qty); i.optAmt = i.qty * per; i.amt = i.base + i.optAmt; p.sum += i.amt;
      }
      const t = totals[i.label] || (totals[i.label] = { qty: 0, amt: 0, miss: false });
      t.qty += i.qty;
      if (i.amt === null) t.miss = true; else t.amt += i.amt;
    });
    grand += p.sum;
  });
  last = { people, totals, grand };
  unkList = [...unk.values()];
  renderUnknown(); renderResult();
}

const REQ_RE = /(맵|빼|덜|많이|적게|없이|따로|안\s?넣|말고|주세요|해줘|세요)/;
function candidates(u) {
  const m = menu(), out = [];
  Object.keys(m).forEach(n => out.push({ v: 'am:' + n, label: `별칭 → ${n} (메뉴)`, name: n, s: Math.max(sim(u.name, n), ...m[n].alias.map(a => sim(u.name, a))) }));
  if (u.ctx) {
    const os = m[u.ctx].opts;
    Object.keys(os).forEach(o => out.push({ v: 'ao:' + o, label: `별칭 → ${u.ctx}의 ${o} (옵션)`, name: o, s: Math.max(sim(u.name, o), ...os[o].alias.map(a => sim(u.name, a))) }));
  }
  return out.sort((a, b) => b.s - a.s).slice(0, 6);
}
function renderUnknown() {
  const el = $('unk');
  el.hidden = !unkList.length;
  if (!unkList.length) return;
  el.innerHTML = `<h2>⚠ 등록되지 않은 항목 ${unkList.length}개</h2><div class="sub" style="margin-bottom:8px">띄어쓰기가 있는 이름(삶은 계란)은 한 항목으로 묶어 보여줍니다. 서로 다른 메뉴가 붙어 있으면 '나누기'를 누르거나 쉼표로 구분해 쓰세요. 별칭·요청사항(덜맵게 등)은 가격 없이 등록됩니다. 여러 단어 요청은 아래 '요청사항' 칸에 문구째 등록하거나 #샐러드_빼고 처럼 쓰세요.</div>` + unkList.map((u, i) => {
    const cs = candidates(u), best = cs[0] && cs[0].s >= 0.7 ? cs[0] : null;
    const isReq = !best && REQ_RE.test(u.name);
    const opts = [{ v: 'menu', label: '새 메뉴' }, { v: 'note', label: '요청사항 (금액 없음)' }];
    if (u.ctx) opts.push({ v: 'opt', label: `${u.ctx}의 옵션` }, { v: 'optm', label: `${u.ctx}의 옵션 (개수형·토핑)` });
    cs.forEach(c => opts.push({ v: c.v, label: c.label }));
    const sel = u.kind || (best ? best.v : isReq ? 'note' : 'menu');
    return `<div class="row" style="margin-bottom:8px"><b style="min-width:90px">${esc(u.name)}</b>
     <input class="price" type="number" min="0" step="100" placeholder="가격" data-u="${i}" value="${esc(u.price || '')}"> 원
     <select data-k="${i}" style="flex:none;min-width:0;max-width:100%">${opts.map(o => `<option value="${esc(o.v)}"${o.v === sel ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}</select>
     <button data-r="${i}">등록</button>${u.name.includes(' ') ? `<button data-sp="${i}" title="띄어쓰기 기준으로 각각 다른 항목으로 나눕니다">나누기</button>` : ''}
     ${!u.kind && isReq ? '<div class="sub" style="width:100%">💡 요청사항처럼 보여서 \'요청사항(금액 없음)\'으로 선택해 두었어요. 메뉴라면 \'새 메뉴\'로 바꾸고 가격을 입력하세요</div>' : ''}${!u.kind && best ? `<div class="sub" style="width:100%">💡 '${esc(best.name)}'과(와) 비슷해요. 같은 메뉴라면 그대로 등록하세요 (별칭으로 저장됩니다)</div>` : ''}</div>`;
  }).join('') + '<button id="regAll" class="pri">입력한 항목 모두 등록</button>';
}
function register(i) {
  const u = unkList[i], box = $('unk');
  const inp = box.querySelector(`[data-u="${i}"]`), kind = box.querySelector(`[data-k="${i}"]`).value;
  if (kind === 'note') { state.notes[u.name] = 1; return true; }
  if (kind.startsWith('am:') || kind.startsWith('ao:')) {
    const t = kind.startsWith('am:') ? menu()[kind.slice(3)] : (menu()[u.ctx] || { opts: {} }).opts[kind.slice(3)];
    if (!t) return false;
    if (!t.alias.includes(u.name)) t.alias.push(u.name);
    return true;
  }
  const price = Math.round(parseFloat(inp.value));
  if (inp.value === '' || !(price >= 0)) return false;
  if (kind === 'menu') setMenu(u.name, price);
  else menu()[u.ctx].opts[u.name] = { price, tiers: {}, multi: kind === 'optm', alias: [] };
  return true;
}

function budget(sum, limit) {
  if (!(limit > 0)) return null;
  const diff = limit - sum;
  const cls = sum > limit ? 'over' : sum >= limit * 0.8 ? 'warn' : 'ok';
  const text = sum > limit ? `${won(sum - limit)} 초과` : diff === 0 ? '한도에 딱 맞음' : `${won(diff)} 남음`;
  return { cls, pct: Math.min(sum / limit * 100, 100), text };
}
const barHtml = (b, label) => b ? `<div class="bar ${b.cls}"><i style="width:${b.pct}%"></i></div><div class="blab ${b.cls}"><span>${label}</span><b>${b.text}</b></div>` : '';
const isOver = sum => state.limit > 0 && sum > state.limit;
function summaryHtml(people, grand, miss) {
  const lim = state.limit;
  if (!(lim > 0)) return '';
  const totalLim = lim * people.length, b = budget(grand, totalLim);
  const over = people.filter(p => p.sum > lim);
  return `<div class="card${b.cls === 'over' ? ' overc' : ''}"><h2>예산 현황 <span class="sub">인당 ${won(lim)} · ${people.length}명 기준</span></h2>
    <div class="person"><span>총액 / 총 한도</span><span>${won(grand)} / ${won(totalLim)}</span></div>
    ${barHtml(b, '총 한도 ' + won(totalLim))}
    <div class="note" style="margin-top:8px">${over.length ? `<b class="bad">⚠ 인당 한도 초과 ${over.length}명</b>: ${over.map(p => `${esc(p.name)}(+${won(p.sum - lim)})`).join(', ')}` : '✔ 모두 인당 한도 이내'}${miss ? ' · 가격 미등록 항목은 금액에서 제외되어 있습니다' : ''}</div></div>`;
}

function renderResult() {
  const el = $('result');
  if (!last || !last.people.length) { el.innerHTML = ''; return; }
  const { people, totals, grand } = last;
  const hasMiss = people.some(p => p.miss);
  let h = summaryHtml(people, grand, hasMiss) + people.map(p => `<div class="card${isOver(p.sum) ? ' overc' : ''}"><div class="person"><span>${esc(p.name)}${isOver(p.sum) ? '<span class="badge">초과</span>' : ''}</span><span>${won(p.sum)}${p.miss ? ' <span class="unk">(미등록 제외)</span>' : ''}</span></div>${barHtml(budget(p.sum, state.limit), '인당 한도 ' + won(state.limit))}` +
    (p.items.length ? '<table>' + p.items.map(i =>
      `<tr><td>${esc(i.label)}${i.qty > 1 ? ' × ' + i.qty : ''}${i.notes.length ? `<div class="note">└ 요청: ${esc(i.notes.join(', '))}</div>` : ''}${i.optAmt ? `<div class="sub">기본 ${won(i.base)} + 옵션 ${won(i.optAmt)}</div>` : ''}</td><td class="n">${i.amt === null ? '<span class="unk">가격 미등록</span>' : won(i.amt)}</td></tr>`).join('') + '</table>'
      : '<div class="sub">주문 내용을 찾지 못했습니다.</div>') + (p.notes.length ? `<div class="note">요청: ${esc(p.notes.join(', '))}</div>` : '') + '</div>').join('');
  const reqs = people.filter(p => p.notes.length || p.items.some(i => i.notes.length));
  if (reqs.length) {
    h += '<div class="card"><h2>요청사항 모음</h2><table>' + reqs.map(p => {
      const parts = p.items.filter(i => i.notes.length).map(i => `${esc(i.label)}: ${esc(i.notes.join(', '))}`).concat(p.notes.map(n => esc(n)));
      return `<tr><td style="white-space:nowrap;padding-right:10px">${esc(p.name)}</td><td>${parts.join('<br>')}</td></tr>`;
    }).join('') + '</table></div>';
  }
  h += '<div class="card"><h2>메뉴별 합계</h2><table>' + Object.keys(totals).map(n =>
    `<tr><td>${esc(n)}</td><td class="n">${totals[n].qty}개</td><td class="n">${totals[n].miss ? '<span class="unk">미등록 포함</span>' : won(totals[n].amt)}</td></tr>`).join('') + '</table>' +
    `<div class="total">총 ${people.length}명 · ${won(grand)}${hasMiss ? ' <span class="unk">(미등록 제외)</span>' : ''}</div>
     <div class="row" style="justify-content:flex-end;margin-top:8px">
       <button id="saveHistory" class="pri">현재 주문 내역 기록</button>
       <button id="copy">결과 복사</button>
       <span id="copied" class="ok"></span>
     </div></div>`;
  el.innerHTML = h;
}
function resultText() {
  const { people, grand } = last;
  const lines = people.map(p => `${p.name}: ${p.items.map(i => i.label + (i.qty > 1 ? ' x' + i.qty : '') + (i.notes.length ? ' [' + i.notes.join(', ') + ']' : '')).join(', ')} = ${won(p.sum)}${p.miss ? ' (미등록 제외)' : ''}${p.notes.length ? ' [요청: ' + p.notes.join(', ') + ']' : ''}${isOver(p.sum) ? ' ⚠ ' + won(p.sum - state.limit) + ' 초과' : ''}`);
  lines.push('', `총 ${people.length}명 ${won(grand)}${state.limit > 0 ? ' / 총 한도 ' + won(state.limit * people.length) : ''}`);
  return lines.join('\n');
}
function renderNotes() {

}

$('menuBody').addEventListener('click', e => {

$('unk').addEventListener('input', e => { const i = e.target.dataset.u; if (i !== undefined && unkList[i]) unkList[i].price = e.target.value; });
$('unk').addEventListener('change', e => { const i = e.target.dataset.k; if (i !== undefined && unkList[i]) unkList[i].kind = e.target.value; });
$('unk').addEventListener('click', e => {
  if (e.target.dataset.sp !== undefined) {

$('unk').addEventListener('keydown', e => {

$('result').addEventListener('click', async e => {

const isObj = o => o && typeof o === 'object' && !Array.isArray(o);

function renderHistory() {
  const r = state.restaurants[state.current];
  if (!r || !r.history) r.history = [];
  const selectedDate = $('historyDateFilter').value;
  
  let hList = r.history;
  if (selectedDate) {
    hList = hList.filter(item => {
      if (!item.date) return false;
      const parts = selectedDate.split('-');
      if (parts.length === 3) {
        const targetStr = `${parts[0]}. ${+parts[1]}. ${+parts[2]}.`;
        return item.date.includes(targetStr) || item.date.startsWith(selectedDate);
      }
      return item.date.includes(selectedDate);
    });
  }

  $('historySum').textContent = `${state.current} 주문 기록 (${hList.length}개${selectedDate ? ' - 선택일 필터 적용됨' : ''})`;
  if (!hList.length) {
    $('historyList').innerHTML = '<div class="sub">조건에 맞는 주문 기록이 없습니다. 주문 계산 후 [현재 주문 내역 기록] 버튼을 눌러 저장하세요.</div>';
    return;
  }
  
  $('historyList').innerHTML = hList.map((item) => {
    const realIdx = r.history.indexOf(item);
    return `
      <div class="detail" style="margin-bottom:8px">
        <div class="row" style="justify-content:space-between;margin-bottom:4px">
          <div><b>[${esc(item.round || '1차')}]</b> <span class="sub">${esc(item.date)}</span></div>
          <div>
            <button data-load-hist="${realIdx}">입력창에 불러오기</button>
            <button class="del" data-del-hist="${realIdx}">삭제</button>
          </div>
        </div>
        <div class="sub" style="white-space:pre-wrap;font-family:monospace;background:var(--card);padding:6px;border-radius:6px">${esc(item.input)}</div>
        <div class="row" style="justify-content:space-between;margin-top:4px;font-weight:600">
          <span>총 인원: ${item.peopleCount}명</span>
          <span>총액: ${won(item.grand)}</span>
        </div>
      </div>
    `;
  }).join('');
}

$('historyDateFilter').onchange = renderHistory;
$('clearDateFilter').onclick = () => {
  $('historyDateFilter').value = '';
  renderHistory();
};

$('historyList').addEventListener('click', e => {
  const loadIdx = e.target.dataset.loadHist;
  const delIdx = e.target.dataset.delHist;
  const r = state.restaurants[state.current];
  
  if (loadIdx !== undefined) {
    const item = r.history[+loadIdx];
    if (item) {
      $('input').value = item.input;
      calc();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  } else if (delIdx !== undefined) {
  if (confirm('이 주문 기록을 삭제하시겠습니까?')) {
    r.history.splice(+delIdx, 1);
    
    // 로컬 저장 즉시 실행
    saveLocal();
    $('syncStatus').textContent = '주문 기록 삭제 및 클라우드 동기화 중...';
    
    // Supabase Storage 업로드가 완료될 때까지 대기
    await saveSupabaseStorage(); 
    
    renderHistory();
  }
}
});

$('result').addEventListener('click', async e => {
  if (e.target.id === 'saveHistory') {
    if (!last || !last.people.length) { alert('기록할 계산 결과가 없습니다. 먼저 주문을 계산해주세요.'); return; }
    const r = state.restaurants[state.current];
    if (!r.history) r.history = [];
    
    const todayStr = new Date().toLocaleDateString('ko-KR');
    const todayItems = r.history.filter(item => item.date && item.date.startsWith(todayStr));
    const roundNum = todayItems.length + 1;
    const finalRound = roundNum + '차';

    const inputText = $('input').value;
    
    r.history.unshift({
      date: new Date().toLocaleString('ko-KR'),
      round: finalRound,
      input: inputText,
      peopleCount: last.people.length,
      grand: last.grand
    });

    // 로컬 및 Supabase 동기화 실행
    saveLocal();
    $('syncStatus').textContent = '주문 기록 클라우드 동기화 중...';
    await saveSupabaseStorage(); // 저장이 끝날 때까지 대기
    
    renderHistory();
    alert(`'${state.current}' [${todayStr} - ${finalRound}] 주문 기록이 Supabase에 안전하게 저장되었습니다.`);
    return;
  }
});

// 초기 실행 및 데이터 로드
(async () => {
  await load();
  $('limit').value = state.limit;
  renderRest();
  renderMenu();
  renderNotes();
  renderHistory();
})();
</script>
</body>
</html>
